name: Build APKs

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (manual)
        run: |
          set -e
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          rm cmdline.zip
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT $HOME/android-sdk"
          ls -la $HOME/android-sdk/cmdline-tools/latest/bin/ | head
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-29" "build-tools;30.0.3" "platform-tools"
          sdkmanager --list_installed
          echo "SDK ready: $HOME/android-sdk"

      - name: Install SDK packages
        run: |
          sdkmanager --list_installed

      - name: Build MathAscend APK
        run: |
          export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-29/android.jar"
          export BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/30.0.3"
          chmod +x build-apk.sh
          ./build-apk.sh
        working-directory: MathAscend

      - name: Build Angelspiel APK
        run: |
          export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-29/android.jar"
          export BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/30.0.3"
          chmod +x build-apk.sh
          ./build-apk.sh
        working-directory: Angelspiel

      - name: List APKs
        run: |
          ls -lh MathAscend/releases/ Angelspiel/releases/
          sha256sum MathAscend/releases/*.apk Angelspiel/releases/*.apk || true
          ls -lh docs/*.pptx *.pptx 2>&1 | head

      - name: Upload MathAscend APK
        uses: actions/upload-artifact@v4
        with:
          name: MathAscend-apk
          path: MathAscend/releases/*.apk
          if-no-files-found: warn

      - name: Upload Angelspiel APK
        uses: actions/upload-artifact@v4
        with:
          name: Angelspiel-apk
          path: Angelspiel/releases/*.apk
          if-no-files-found: warn

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MathAscend/releases/*.apk
            Angelspiel/releases/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
