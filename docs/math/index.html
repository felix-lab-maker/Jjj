<!DOCTYPE html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Math Ascend</title><style>
:root{--bg:#090c18;--panel:#14192d;--muted:#9aa7c3;--cyan:#56e5f5;--purple:#a18aff;--green:#65ecaf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f6ff;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:26px 20px 100px}header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:18px;font-weight:900;letter-spacing:2px}.brand span{color:var(--cyan)}.tag,.pill{border:1px solid #303952;border-radius:30px;padding:6px 11px;font-size:11px;color:var(--muted)}h1{font-size:40px;line-height:1.1;letter-spacing:-1.6px;margin:20px 0 14px}h2{font-size:22px;margin:6px 0 12px}h3{margin:0 0 8px}p{color:var(--muted);line-height:1.6}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--cyan);font-weight:800}.hero{padding:30px 0 18px}.glow{color:var(--purple)}.card{background:var(--panel);border:1px solid #28314b;border-radius:20px;padding:20px;margin:14px 0}.featured{background:linear-gradient(130deg,#202743,#19152f);border-color:#575083}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#13182a;border:1px solid #263049;border-radius:16px;padding:15px 8px;text-align:center}.stat b{display:block;font-size:24px;color:var(--cyan)}small{color:var(--muted);font-size:12px}button{font:inherit;cursor:pointer;border:0;border-radius:13px;background:#27314b;color:white;padding:14px 18px;font-weight:700}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--cyan);color:#08131b;width:100%;margin-top:12px}.secondary{background:#292344;color:#cbbcff}.world{display:flex;gap:16px;align-items:center}.num{min-width:44px;height:44px;border-radius:13px;background:#272b4b;color:var(--purple);display:grid;place-items:center;font-weight:800}.world .info{flex:1}.world h3{font-size:16px}.world p{font-size:12px;margin:0}.world button{padding:10px 12px;font-size:12px}.progress{height:5px;border-radius:10px;background:#2b3450;margin-top:14px;overflow:hidden}.progress i{display:block;height:100%;background:var(--cyan)}nav{position:fixed;bottom:0;left:0;right:0;background:#0d1223f5;border-top:1px solid #2b334a;display:flex;justify-content:center;padding:10px 8px max(12px,env(safe-area-inset-bottom));gap:6px}nav button{background:transparent;font-size:12px;padding:12px;color:var(--muted)}nav button.active{color:var(--cyan);background:#17293b}.question{font-size:29px;line-height:1.4;margin:24px 0;white-space:pre-line}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:68px;overflow-wrap:anywhere;border:1px solid #364260}.good{background:#123e31!important;border-color:var(--green)!important}.bad{background:#4c2038!important;border-color:#ff7ca2!important}.feedback{padding:16px;border-radius:12px;background:#0a1020;margin-top:16px;line-height:1.6}.hidden{display:none!important}.sectionhead{margin-top:30px}.notice{font-size:13px;border-left:3px solid var(--purple);padding-left:12px}.shopitem{display:flex;align-items:center;gap:12px}.shopitem div{flex:1}.shopitem p{font-size:13px;margin:0}.score{font-size:60px;color:var(--cyan);font-weight:900}.theme-pink{--cyan:#ff89c4;--purple:#ffc16b}.theme-lime{--cyan:#c1f777;--purple:#65ddf3}input[type=checkbox]{accent-color:var(--cyan)}.rank{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:16px 0;border-bottom:1px solid #28314b}a{color:var(--cyan)}
</style><body><main><header><div class="brand">MATH<span> ASCEND</span></div><span class="tag">OFFLINE · V1</span></header><div id="view"></div></main><nav id="nav"></nav><script>
'use strict';
const KEY='mathascend-v1';let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}s=Object.assign({coins:0,xp:0,unlocked:0,best:0,history:[],themes:['cyan'],theme:'cyan',hint:false,correct:0},s||{});let tab='home',game=null;
const worlds=[['01','Zahlenfunken','Kopfrechnen · Grundrechenarten'],['02','Bruchlabor','Brüche · Prozent · Verhältnisse'],['03','Unbekannte','Gleichungen · Potenzen'],['04','Kurvenraum','Funktionen · Trigonometrie'],['05','Unendlichkeit','Ableitungen · Integrale'],['06','Ereignishorizont','Matrizen · Komplexe Zahlen · DGL']];
const $=id=>document.getElementById(id),rand=n=>Math.floor(Math.random()*n),pick=a=>a[rand(a.length)];function save(){localStorage.setItem(KEY,JSON.stringify(s))}function theme(){document.body.className=s.theme==='cyan'?'':'theme-'+s.theme}theme();
function navigate(t){if(game&&!confirm('Runde verlassen? Der aktuelle Fortschritt dieser Runde verfällt.'))return;game=null;tab=t;render();window.scrollTo(0,0)}
function render(){ $('nav').innerHTML=[['home','◇ Spielen'],['shop','✧ Upgrades'],['ranks','▤ Rekorde'],['settings','⚙ Info']].map(([t,n])=>`<button class="${tab===t?'active':''}" onclick="navigate('${t}')">${n}</button>`).join('');if(tab==='home')home();if(tab==='shop')shop();if(tab==='ranks')ranks();if(tab==='settings')settings()}
function home(){ $('view').innerHTML=`<section class="hero"><div class="eyebrow">DEIN AUFSTIEG BEGINNT IM KOPF</div><h1>Kleine Schritte.<br><span class="glow">Unendliche Möglichkeiten.</span></h1><p>Knacke Aufgaben, sammle Energie und entdecke neue mathematische Welten.</p></section><div class="stats"><div class="stat"><b>${s.xp}</b><small>Gesamt-XP</small></div><div class="stat"><b>${s.coins}</b><small>Energie ✧</small></div><div class="stat"><b>${s.best}</b><small>Rundenrekord</small></div></div><div class="card featured"><div class="eyebrow">NÄCHSTE MISSION</div><h2>${worlds[s.unlocked][1]}</h2><p>8 Aufgaben · 3 Leben · kein Zeitdruck<br>Ab 6 richtigen Antworten geht es weiter.</p><button class="primary" onclick="start(${s.unlocked},false)">Mission starten →</button></div><h2 class="sectionhead">Dein Lernpfad</h2>${worlds.map((w,i)=>`<div class="card"><div class="world"><div class="num">${w[0]}</div><div class="info"><h3>${w[1]}</h3><p>${w[2]}</p></div><button ${i>s.unlocked?'disabled':''} onclick="start(${i},false)">${i>s.unlocked?'Gesperrt':'Spielen'}</button></div></div>`).join('')}<div class="card"><div class="eyebrow">FREIES TRAINING</div><h3>Auch Experten dürfen neugierig sein.</h3><p>Alle Welten ohne Leben ausprobieren. Keine Energie, keine Ranglistenpunkte.</p><div class="answers">${worlds.map((w,i)=>`<button onclick="start(${i},true)">${w[0]} · ${w[1]}</button>`).join('')}</div></div><p class="notice">Textaufgaben dieser Version stammen aus geprüften Vorlagen. Live-KI und Online-Ranglisten sind noch nicht verbunden.</p>`}
function q(text,answer,choices,explanation){return {text,answer:String(answer),choices:choices.map(String),explanation}}
function numeric(text,a,exp){let v=new Set([a]);let attempts=0;while(v.size<4&&attempts++<100)v.add(a+pick([-1,1])* (1+rand(10)));return q(text,a,[...v],exp)}
function makeQ(w,n){let a=2+rand(13),b=2+rand(9),x=1+rand(9);if(w===0){if(n%3===0)return numeric(`Ein Raumschiff hat ${a} Kisten mit je ${b} Energiezellen. Wie viele Zellen sind das?`,a*b,`${a} × ${b} = ${a*b}.`);if(n%3===1)return numeric(`${a*b} ÷ ${b} = ?`,a,`Division ist die Umkehrung der Multiplikation: ${a} × ${b} = ${a*b}.`);return numeric(`${a} + ${b} × ${x} = ?`,a+b*x,`Punkt vor Strich: erst ${b} × ${x}, dann ${a} addieren.`)}
if(w===1){if(n%2===0){let p=pick([10,20,25,50]),price=20*(1+rand(10));return numeric(`Eine Ausrüstung kostet ${price} Energie. Es gibt ${p} % Rabatt. Wie viel bezahlst du?`,price*(100-p)/100,`Rabatt: ${price} × ${p}/100. Neuer Preis: ${price} − ${price*p/100} = ${price*(100-p)/100}.`)}return numeric(`Ein Tank fasst ${b*12} Liter. Er ist zu ¾ gefüllt. Wie viele Liter sind darin?`,b*9,`${b*12} ÷ 4 × 3 = ${b*9} Liter.`)}
if(w===2){if(n%2===0)return numeric(`Bestimme x:\n${b}x + ${a} = ${b*x+a}`,x,`Auf beiden Seiten ${a} abziehen, dann durch ${b} teilen.`);return numeric(`Vereinfache und berechne: (${a}² − ${a}) ÷ ${a}`,a-1,`Zähler ausklammern: a(a − 1). Nach Division durch a bleibt a − 1.`)}
if(w===3){if(n%3===0)return numeric(`f(x) = ${b}x² − ${a}\nWie groß ist f(${x})?`,b*x*x-a,`Einsetzen: ${b} × ${x}² − ${a} = ${b*x*x-a}.`);if(n%3===1)return q('Wie groß ist sin(π/6)?','1/2',['1/2','√3/2','0','1'],'π/6 entspricht 30°. Im rechtwinkligen 30°-Dreieck ist die Gegenkathete halb so lang wie die Hypotenuse.');return numeric(`Ein rechtwinkliges Dreieck hat Katheten ${3*x} und ${4*x}. Wie lang ist die Hypotenuse?`,5*x,`Satz des Pythagoras: √((${3*x})² + (${4*x})²) = ${5*x}.`)}
if(w===4){if(n%3===0)return numeric(`f(x) = x³ + ${a}x\nBerechne f′(${x}).`,3*x*x+a,`f′(x) = 3x² + ${a}. Also f′(${x}) = ${3*x*x+a}.`);if(n%3===1)return numeric(`Berechne das bestimmte Integral:\n∫₀² ${a}x dx`,2*a,`Eine Stammfunktion ist (${a}/2)x². An den Grenzen: (${a}/2) × 4 − 0 = ${2*a}.`);return q('lim (x → 0) sin(x)/x = ?','1',['1','0','∞','Existiert nicht'],'Bei Winkeln im Bogenmaß gilt der Standardgrenzwert sin(x)/x → 1, z. B. nach dem Sandwich-Satz.')}
if(n%4===0)return numeric(`Bestimme die Determinante:\n[ ${a}   ${b} ]\n[  2    ${x} ]`,a*x-2*b,`Für eine 2×2-Matrix gilt det = ad − bc = ${a} × ${x} − ${b} × 2.`);if(n%4===1)return q('Löse die Anfangswertaufgabe:\ny′ = 2y,  y(0) = 3','y = 3e^(2x)',['y = 3e^(2x)','y = 2e^(3x)','y = 3 + 2x','y = e^(2x) + 2'],'Die allgemeine Lösung lautet y = Ce^(2x). Aus y(0) = C = 3 folgt y = 3e^(2x).');if(n%4===2)return q('Welche Eigenwerte hat die Matrix?\n[ 2  1 ]\n[ 0  3 ]','2 und 3',['2 und 3','1 und 3','0 und 5','−2 und −3'],'Bei einer Dreiecksmatrix sind die Diagonaleinträge die Eigenwerte: det(A − λI) = (2 − λ)(3 − λ).');return q('Berechne in den komplexen Zahlen:\n(1 + i)²','2i',['2i','2','1 + 2i','−2i'],'Ausmultiplizieren: 1 + 2i + i². Mit i² = −1 bleibt 2i.')}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function start(w,training){tab='home';game={w,training,index:0,right:0,lives:3,score:0,combo:0,answered:false,hinted:false};$('nav').innerHTML='';nextQ();window.scrollTo(0,0)}
function nextQ(){game.q=makeQ(game.w,game.index);game.q.choices=shuffle(game.q.choices);game.answered=false;game.hinted=false;drawQ()}
function drawQ(){let g=game;$('view').innerHTML=`<div class="row" style="margin-top:28px"><button onclick="navigate('home')">←</button><span class="pill">${g.training?'TRAINING':'MISSION'} · ${worlds[g.w][1]}</span><b style="color:#ff91b6">${g.training?'∞': '♥'.repeat(g.lives)}</b></div><div class="progress"><i style="width:${g.index/8*100}%"></i></div><div class="row" style="margin-top:20px"><small>AUFGABE ${g.index+1} / 8</small><span class="eyebrow">${g.score} P · ${g.combo}× KOMBO</span></div><div class="card"><div class="eyebrow">DENK EINEN SCHRITT WEITER</div><div class="question" id="question"></div><div class="answers" id="answers"></div><div id="feedback" aria-live="polite"></div>${s.hint&&g.training?'<button style="margin-top:14px" onclick="hint()">✧ Lösungsweg ansehen</button>':''}</div><p class="notice">${g.training?'Training: Fehler sind Teil des Lernens.':'Richtige Antwort: 100 Punkte + Kombo-Bonus. Keine Zeitstrafe.'}</p>`;$('question').textContent=g.q.text;g.q.choices.forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>answer(v);$('answers').appendChild(b)})}
function hint(){if(game.hinted||game.answered)return;game.hinted=true;$('feedback').textContent=game.q.explanation}
function answer(v){let g=game;if(!g||g.answered)return;g.answered=true;let correct=v===g.q.answer;if(correct){g.right++;g.combo++;g.score+=100+Math.min(g.combo-1,5)*20}else{g.combo=0;g.lives--}Array.from($('answers').children).forEach(b=>{b.disabled=true;if(b.textContent===g.q.answer)b.classList.add('good');else if(b.textContent===v)b.classList.add('bad')});$('feedback').innerHTML=`<div class="feedback"><strong>${correct?'✓ Richtig!':'✕ Noch nicht ganz.'}</strong><div id="explain"></div><button class="primary" onclick="advance()">${g.index===7||(!g.training&&g.lives===0)?'Ergebnis ansehen':'Weiter →'}</button></div>`;$('explain').textContent=g.q.explanation}
function advance(){if(!game||!game.answered)return;game.index++;if(game.index>=8||(!game.training&&game.lives<=0))finish();else nextQ()}
function finish(){let g=game;let passed=g.right>=6,earned=g.right*10;if(!g.training){s.coins+=earned;s.xp+=g.right*25;s.correct+=g.right;s.best=Math.max(s.best,g.score);if(passed&&g.w===s.unlocked)s.unlocked=Math.min(5,s.unlocked+1);s.history.unshift({score:g.score,world:g.w,date:new Date().toLocaleDateString('de-DE'),right:g.right});s.history=s.history.slice(0,30);save()}game=null;render();$('view').innerHTML=`<div class="hero"><div class="eyebrow">${g.training?'TRAINING ABGESCHLOSSEN':'MISSION AUSGEWERTET'}</div><h1>${passed?'Stark gerechnet.':'Jeder Versuch zählt.'}</h1><div class="score">${g.score}</div><p>Punkte · ${g.right} von ${g.index} richtig</p><div class="card"><h3>${g.training?'Wissen ist dein Upgrade.':passed?'Mission bestanden ✓':'Noch ein Versuch?'}</h3><p>${g.training?'Training verändert weder Energie noch Rekorde.':`+${earned} Energie · +${g.right*25} XP. ${passed?'Dein Lernpfad wurde aktualisiert.':'Für die nächste Welt brauchst du 6 richtige Antworten in einer Runde.'}`}</p></div><button class="primary" onclick="start(${g.w},${g.training})">Noch eine Runde</button><button style="width:100%;margin-top:12px" onclick="render()">Zur Übersicht</button></div>`}
function shop(){ $('view').innerHTML=`<section class="hero"><div class="eyebrow">DEIN STIL. DEIN FORTSCHRITT.</div><h1>Upgrade dein<br><span class="glow">Universum.</span></h1><p>${s.coins} Energie verfügbar · Nur erspielte Währung, keine Käufe.</p></section>${[['cyan','Arctic Cyan','Das ursprüngliche Neon-Design.',0],['pink','Solar Rose','Pink trifft auf warmes Gold.',120],['lime','Ion Lime','Elektrisches Grün und Eisblau.',120]].map(([id,name,desc,cost])=>`<div class="card shopitem"><div><h3>${name}</h3><p>${desc}</p></div><button onclick="buyTheme('${id}',${cost})">${s.theme===id?'Aktiv':s.themes.includes(id)?'Nutzen':cost+' ✧'}</button></div>`).join('')}<div class="card shopitem"><div><h3>Trainings-Coach</h3><p>Zeige im freien Training den Lösungsweg schon vor deiner Antwort.</p></div><button onclick="buyHint()" ${s.hint?'disabled':''}>${s.hint?'Freigeschaltet':'180 ✧'}</button></div><p class="notice">Keine Upgrades für zusätzliche Ranglistenpunkte. Alle Missionen haben dieselben Regeln.</p>`}
function buyTheme(id,cost){if(!s.themes.includes(id)){if(s.coins<cost){alert('Dafür fehlt noch Energie. Spiele weitere Missionen.');return}s.coins-=cost;s.themes.push(id)}s.theme=id;save();theme();shop()}function buyHint(){if(s.hint)return;if(s.coins<180){alert('Du brauchst 180 Energie.');return}s.coins-=180;s.hint=true;save();shop()}
function ranks(){let rows=[...s.history].sort((a,b)=>b.score-a.score).slice(0,10);$('view').innerHTML=`<section class="hero"><div class="eyebrow">DEIN PERSÖNLICHES BEST-OF</div><h1>Immer ein Stück<br><span class="glow">weiter oben.</span></h1><p>Lokale Bestenliste auf diesem Gerät.</p></section><div class="card"><div class="row"><h3>Top 10 Runden</h3><span class="pill">LOKAL</span></div>${rows.length?rows.map((r,i)=>`<div class="rank"><b>${i+1}</b><div>${worlds[r.world][1]}<br><small>${r.date} · ${r.right} richtig</small></div><b style="color:var(--cyan)">${r.score}</b></div>`).join(''):'<p>Noch keine Ergebnisse. Starte deine erste Mission!</p>'}</div><div class="card"><h3>Globale Rangliste</h3><p>Noch nicht verbunden. Diese Version sendet keine Daten an einen Server und zeigt keine erfundenen Mitspieler.</p><small>Später: Benutzerkonten, servergeprüfte Ergebnisse und getrennte Wettbewerbe nach Schwierigkeitsgrad.</small></div>`}
function settings(){$('view').innerHTML=`<section class="hero"><div class="eyebrow">MATH ASCEND · PROTOTYP 1.0</div><h1>Gut zu wissen.</h1></section><div class="card"><h3>Offline & privat</h3><p>Spielstände bleiben lokal auf deinem Gerät. Keine Konten, keine Werbung, keine Zahlungen und keine Übertragung von Aktionen. Beim Löschen der App können diese Daten verloren gehen.</p></div><div class="card"><h3>Aufgaben & KI</h3><p>Die Aufgaben werden lokal aus mathematisch festgelegten Vorlagen erzeugt. Der Expertenbereich enthält einen kleinen Einstieg in Hochschulmathematik, noch keinen vollständigen Kurs. Freie Formeleingabe und Beweisprüfung sind nicht enthalten.</p><p>Live-KI ist noch nicht eingebaut. Für eine spätere Version gehören KI-Schlüssel ausschließlich auf den Server; generierte Aufgaben müssen unabhängig geprüft werden.</p></div><div class="card"><h3>Fair spielen</h3><p>In Missionen gibt es drei Leben. Sechs von acht richtigen Antworten schalten die nächste Welt frei. Training ist jederzeit in allen Welten möglich.</p><p>Die lokale Bestenliste ist nicht manipulationssicher und keine Online-Rangliste.</p></div><button onclick="reset()">Lokalen Spielstand zurücksetzen</button>`}function reset(){if(confirm('Alle lokalen Fortschritte und Upgrades endgültig löschen?')){localStorage.removeItem(KEY);location.reload()}}
render();
</script></body></html>
